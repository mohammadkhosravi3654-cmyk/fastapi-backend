name: Build Music Fusion APK
on:
  push:
    paths:
      - "music-fusion/**"
      - ".github/workflows/build-music-fusion.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: music-fusion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build APK
        run: /tmp/gradle-8.10.2/bin/gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFusion-v1.0
          path: music-fusion/app/build/outputs/apk/debug/app-debug.apk